name: Build and deploy .NET application to container app gym-api
on:
  push:
    branches:
    - main
permissions:
  id-token: write
  contents: read
env:
  CONTAINER_APP_CONTAINER_NAME: gym-api
  CONTAINER_APP_NAME: gym-api
  CONTAINER_APP_RESOURCE_GROUP_NAME: GymManagement-RG
  CONTAINER_REGISTRY_LOGIN_SERVER: gymapi20261001030818.azurecr.io
  DOCKER_FILE_PATH: GYM.API/Dockerfile
  PROJECT_NAME_FOR_DOCKER: gymapi
jobs:
  build:
    environment: gym_api_Env
    runs-on: ubuntu-latest
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.GYMAPI20261001030818_USERNAME_599C }}
        password: ${{ secrets.GYMAPI20261001030818_PASSWORD_599C }}
    - name: Build and push container image to registry
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
        file: ${{ env.DOCKER_FILE_PATH }}
  deploy:
    environment: gym_api_Env
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.gym_api_CLIENT_ID_599C }}
        tenant-id: ${{ vars.gym_api_TENANT_ID_599C }}
        subscription-id: ${{ vars.gym_api_SUBSCRIPTION_ID_599C }}
    - name: Deploy to containerapp
      uses: azure/CLI@v2
      with:
        inlineScript: >
          az config set extension.use_dynamic_install=yes_without_prompt

          az containerapp registry set --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --server ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} --username ${{ secrets.GYMAPI20261001030818_USERNAME_599C }} --password ${{ secrets.GYMAPI20261001030818_PASSWORD_599C }}

          az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
    - name: logout
      run: >
        az logout
