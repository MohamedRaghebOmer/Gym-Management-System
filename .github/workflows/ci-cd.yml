name: CI/CD Pipeline - GYM API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  checks: write

env:
  SOLUTION_PATH: GYM.slnx
  CONTAINER_APP_CONTAINER_NAME: gym-api
  CONTAINER_APP_NAME: gym-api
  CONTAINER_APP_RESOURCE_GROUP_NAME: GymManagement-RG
  CONTAINER_REGISTRY_LOGIN_SERVER: gymapi20261001030818.azurecr.io
  DOCKER_FILE_PATH: GYM.API/Dockerfile
  PROJECT_NAME_FOR_DOCKER: gymapi
  DOTNET_VERSION: '8.0.x'

jobs:
  # -------------------------------------------------------------
  # 1. Build Code Stage: Compile the application
  # -------------------------------------------------------------
  build-code:
    name: Build .NET Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK with Cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: 'true'
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build project
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  # -------------------------------------------------------------
  # 2. Test Stage: Run unit tests and publish results
  # -------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: build-code
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK with Cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: 'true'
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Run Tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Unit Tests
          path: '**/test-results.trx'
          reporter: dotnet-trx

  # -------------------------------------------------------------
  # 3. Docker Build Stage: Build and push Docker image
  # -------------------------------------------------------------
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: gym_api_Env
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.GYMAPI20261001030818_USERNAME_599C }}
          password: ${{ secrets.GYMAPI20261001030818_PASSWORD_599C }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
          file: ${{ env.DOCKER_FILE_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 4. Deploy Stage: Deploy to Azure Container Apps
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: gym_api_Env
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.gym_api_CLIENT_ID_599C }}
          tenant-id: ${{ vars.gym_api_TENANT_ID_599C }}
          subscription-id: ${{ vars.gym_api_SUBSCRIPTION_ID_599C }}

      - name: Deploy to containerapp
        uses: azure/CLI@v2
        with:
          inlineScript: >
            az config set extension.use_dynamic_install=yes_without_prompt

            az containerapp registry set --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --server ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} --username ${{ secrets.GYMAPI20261001030818_USERNAME_599C }} --password ${{ secrets.GYMAPI20261001030818_PASSWORD_599C }}

            az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}

      - name: logout
        run: >
          az logout
